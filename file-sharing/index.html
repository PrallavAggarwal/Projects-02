<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>File Sharing</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <h1>Discover your files</h1>
    <div id="folders">
      
    </div>
    <script>



    //send request to backend using axios.
    async function sendInfo(){
      try{
        let fileName = document.getElementById("fileName").value;
        console.log("fileName in sendInfo: ", fileName);

        const res = await axios.get('http://localhost:3001/files',{
          headers:{fileName:fileName,}
        });
        console.log("res.data: ",res.data);
      }
      catch(err){
        console.log("error: ",err);
      }
    }


    //it will fetch info from the given path .
    let str='';
    async function getInfo(path){
      // path = path+str;
      try{
        console.log("very first value of path after getInfo called : ", path);
        //path = path+str;
        let url = path ? (`http://localhost:3001/folder?path=${path}`) : (`http://localhost:3001/folder`)

        console.log("very first value of url inside getInfo : ", url);
        //axios request :::::::::::::::::::::::::::::::::::::
          const res = await axios.get(url);
        console.log("after axios await :::::::::::::::::::") 
        console.log('res.data after axios request from index.html : ',res.data);
        console.log('res.data.paths[0] after axios request from index.html : ',res.data.paths[0]);

        //creating elements :::::::::::::::::::::::::::::::::
        let folders = res.data.paths;
        folders.forEach(file => {
          console.log("Inside index.html:  name: ",file.name)
          console.log("Inside index.html: file.isDirectory() : ", file.isDirectory);
          let div = document.createElement('div');
          let url = path ? "http://localhost:3001/"+path+file.name : "http://localhost:3001/"+file.name;
          div.innerHTML = file.isDirectory ? `<b class="directory" onclick="getSubFolder('${file.name}')" > ${file.name}</b>` : `<a href=${url}>${file.name}</a>`
          document.getElementById("folders").appendChild(div);
          //creating link 
        })
      }
      catch(err){
        console.log("Error while getting info: ",err);
      }
    }
    getInfo();

    //function to get sub folder information
    async function getSubFolder(subFile){
      try{
      console.log("Value of subfile Inside getSubFolder: ", subFile);
      let url = 'http://localhost:3001/subFolder?path='+subFile;
      str = str+subFile+'/';// ''+subfolder= subfolder 
        console.log("str: ",str);
      //const res = await axios.get(url);
     // console.log("res after axios call in getSubFolder : ", res);
       getInfo(str); 
      }
      catch(error){
        console.log("Error occured while calling subFolder in index.html : ", error);
        res.json({
          success:false,
          message:"Error occured while calling subFolder in index.html : ",
          error:error 
        })
      }
    }


    </script>
  </body>
</html>
